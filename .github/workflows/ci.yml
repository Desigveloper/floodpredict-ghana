name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run offline smoke tests
        run: python -m pytest tests/ -v
      - name: Import check (app + scripts)
        run: |
          python -c "from app import features, weather, predict, main"
          python -c "import scripts.train"
