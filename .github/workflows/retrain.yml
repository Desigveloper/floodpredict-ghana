name: Weekly retrain

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch data and retrain
        run: python -m scripts.train
      - name: Commit refreshed model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/flood_model.joblib
          if git diff --cached --quiet; then
            echo "Model unchanged - nothing to commit"
          else
            git commit -m "Weekly model retrain [skip ci]"
            git push
          fi
